name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx vitest run

  e2e:
    # Full browser suite against a throwaway Postgres; Vercel deploys independently on push.
    needs: check
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: saoviet
          POSTGRES_PASSWORD: ci-only # gitleaks:allow throwaway CI database
          POSTGRES_DB: saoviet
        ports: ["5434:5432"]
        options: --health-cmd "pg_isready -U saoviet" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://saoviet:ci-only@127.0.0.1:5434/saoviet # gitleaks:allow
      BETTER_AUTH_URL: http://localhost:3100
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Auth secret for this run only
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: |
          printf 'DATABASE_URL=%s\nBETTER_AUTH_SECRET=%s\n' "$DATABASE_URL" "$BETTER_AUTH_SECRET" > .env.local
          npx drizzle-kit migrate
          npm run db:seed > /dev/null
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
